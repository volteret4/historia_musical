        <title>Music Genre Tree — Classics</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap");

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #0a0a0b;
                --bg2: #111114;
                --bg3: #1a1a1f;
                --border: rgba(255, 255, 255, 0.08);
                --border-active: rgba(255, 255, 255, 0.3);
                --accent: #c8a96e;
                --accent2: #7eb8c8;
                --text: #e8e4dc;
                --text2: #8a8680;
                --text3: #5a5650;
                --node-w: 280px;
                --node-h: auto;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                background: var(--bg);
                color: var(--text);
                font-family: "Space Mono", monospace;
                overflow: hidden;
                cursor: default;
            }

            /* ── canvas layer ── */
            #canvas-layer {
                position: fixed;
                inset: 0;
                pointer-events: none;
            }

            /* ── graph container ── */
            #graph {
                position: fixed;
                inset: 0;
                transform-origin: 0 0;
                will-change: transform;
            }

            /* ── node ── */
            .node {
                position: absolute;
                width: 280px;
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: 2px;
                cursor: pointer;
                transition:
                    border-color 0.2s,
                    box-shadow 0.2s,
                    transform 0.15s;
                user-select: none;
            }
            .node:hover {
                border-color: var(--border-active);
                z-index: 10;
                transform: translateY(-2px);
            }
            .node.active {
                border-color: var(--accent);
                box-shadow:
                    0 0 0 1px var(--accent),
                    0 8px 40px rgba(200, 169, 110, 0.2);
                z-index: 20;
            }
            .node.dimmed {
                opacity: 0.22;
                pointer-events: none;
            }

            .node-header {
                padding: 10px 12px 8px;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: flex-start;
                gap: 8px;
            }
            .node-num {
                font-size: 9px;
                color: var(--text3);
                letter-spacing: 0.08em;
                padding-top: 2px;
                flex-shrink: 0;
            }
            .node-genre {
                font-size: 11px;
                font-weight: 700;
                color: var(--accent);
                letter-spacing: 0.06em;
                text-transform: uppercase;
                line-height: 1.3;
            }
            .node-region {
                font-size: 9px;
                color: var(--text3);
                letter-spacing: 0.05em;
                margin-top: 1px;
            }

            .node-body {
                padding: 8px 12px 10px;
            }
            .node-title {
                font-family: "Instrument Serif", serif;
                font-style: italic;
                font-size: 13px;
                color: var(--text);
                line-height: 1.4;
                margin-bottom: 4px;
            }
            .node-artist {
                font-size: 9px;
                color: var(--text2);
                letter-spacing: 0.04em;
            }
            .node-year {
                font-size: 9px;
                color: var(--text3);
                letter-spacing: 0.04em;
                margin-top: 1px;
            }

            /* ── relation pills ── */
            .node-relations {
                padding: 0 12px 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }
            .rel-pill {
                font-size: 9px;
                letter-spacing: 0.05em;
                padding: 2px 7px;
                border: 1px solid var(--border);
                border-radius: 20px;
                color: var(--text2);
                cursor: pointer;
                transition:
                    border-color 0.15s,
                    color 0.15s,
                    background 0.15s;
                white-space: nowrap;
            }
            .rel-pill:hover {
                border-color: var(--accent2);
                color: var(--accent2);
                background: rgba(126, 184, 200, 0.06);
            }
            .rel-pill.outgoing {
                border-color: rgba(200, 169, 110, 0.3);
                color: var(--accent);
            }
            .rel-pill.incoming {
                border-color: rgba(126, 184, 200, 0.3);
                color: var(--accent2);
            }

            /* ── SVG arrows ── */
            #canvas-layer line,
            #canvas-layer path {
                stroke-width: 1;
                pointer-events: none;
            }

            /* ── UI chrome ── */
            #ui {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 100;
                pointer-events: none;
            }

            #topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 14px 20px;
                pointer-events: all;
            }
            #title-block h1 {
                font-family: "Instrument Serif", serif;
                font-size: 18px;
                font-weight: 400;
                font-style: italic;
                color: var(--text);
                letter-spacing: 0.02em;
            }
            #title-block p {
                font-size: 9px;
                color: var(--text3);
                letter-spacing: 0.1em;
                text-transform: uppercase;
                margin-top: 2px;
            }

            #search-wrap {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            #search {
                background: var(--bg3);
                border: 1px solid var(--border);
                border-radius: 2px;
                padding: 7px 12px;
                color: var(--text);
                font-family: "Space Mono", monospace;
                font-size: 11px;
                width: 220px;
                outline: none;
                transition: border-color 0.2s;
            }
            #search::placeholder {
                color: var(--text3);
            }
            #search:focus {
                border-color: var(--border-active);
            }

            #count {
                font-size: 10px;
                color: var(--text3);
                letter-spacing: 0.06em;
                white-space: nowrap;
            }

            #hint {
                position: fixed;
                bottom: 18px;
                left: 50%;
                transform: translateX(-50%);
                font-size: 9px;
                color: var(--text3);
                letter-spacing: 0.08em;
                text-transform: uppercase;
                pointer-events: none;
                z-index: 100;
            }

            #zoom-btns {
                position: fixed;
                bottom: 18px;
                right: 20px;
                display: flex;
                flex-direction: column;
                gap: 4px;
                z-index: 100;
            }
            .z-btn {
                width: 28px;
                height: 28px;
                background: var(--bg3);
                border: 1px solid var(--border);
                border-radius: 2px;
                color: var(--text2);
                font-size: 14px;
                font-family: "Space Mono", monospace;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    border-color 0.15s,
                    color 0.15s;
            }
            .z-btn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            #reset-btn {
                position: fixed;
                bottom: 18px;
                left: 20px;
                background: var(--bg3);
                border: 1px solid var(--border);
                border-radius: 2px;
                color: var(--text2);
                font-size: 9px;
                font-family: "Space Mono", monospace;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                padding: 6px 12px;
                cursor: pointer;
                z-index: 100;
                transition:
                    border-color 0.15s,
                    color 0.15s;
            }
            #reset-btn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            /* grid bg */
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image:
                    linear-gradient(
                        rgba(255, 255, 255, 0.015) 1px,
                        transparent 1px
                    ),
                    linear-gradient(
                        90deg,
                        rgba(255, 255, 255, 0.015) 1px,
                        transparent 1px
                    );
                background-size: 40px 40px;
                pointer-events: none;
                z-index: 0;
            }
        </style>

                }
            });

            // ═══════════════════════════════════════════════════
            // RENDER
            // ═══════════════════════════════════════════════════
            const graph = document.getElementById("graph");
            const svgEl = document.getElementById("canvas-layer");
            let tx = 0,
                ty = 0,
                scale = 0.55;

            function applyTransform(animated = false) {
                graph.style.transition = animated
                    ? "transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94)"
                    : "none";
                graph.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
                drawEdges();
            }

            // ── build nodes ──
            const nodeEls = {};
            GENRES.forEach((g) => {
                const pos = positions[g.id];
                const div = document.createElement("div");
                div.className = "node";
                div.id = "node-" + g.id;
                div.style.left = pos.x + "px";
                div.style.top = pos.y + "px";
                div.style.borderTopColor = getColor(g.region);
                div.style.borderTopWidth = "2px";

                const allRels = [
                    ...g.rel_out.map((r) => ({ id: r, dir: "out" })),
                    ...GENRES.filter((gg) => gg.rel_out.includes(g.id)).map(
                        (gg) => ({ id: gg.id, dir: "in" }),
                    ),
                ];

                const relPills = allRels
                    .map((r) => {
                        const target = GENRES.find((gg) => gg.id === r.id);
                        if (!target) return "";
                        return `<span class="rel-pill ${r.dir === "out" ? "outgoing" : "incoming"}" data-target="${r.id}" title="${r.dir === "out" ? "→" : "←"} ${target.genre}">
      ${r.dir === "out" ? "→" : "←"} ${target.genre}
    </span>`;
                    })
                    .join("");

                div.innerHTML = `
    <div class="node-header">
      <span class="node-num">${g.num}</span>
      <div>
        <div class="node-genre">${g.genre}</div>
        <div class="node-region">${g.region}</div>
      </div>
    </div>
    <div class="node-body">
      <div class="node-title">${g.title}</div>
      <div class="node-artist">${g.artist}</div>
      ${g.year ? `<div class="node-year">${g.year}</div>` : ""}
    </div>
    ${allRels.length > 0 ? `<div class="node-relations">${relPills}</div>` : ""}
  `;

                div.addEventListener("click", () => activateNode(g.id));
                div.querySelectorAll(".rel-pill").forEach((pill) => {
                    pill.addEventListener("click", (e) => {
                        e.stopPropagation();
                        navigateTo(pill.dataset.target);
                    });
                });

                graph.appendChild(div);
                nodeEls[g.id] = div;
            });

            // ── edges ──
            const edgeEls = {};

            function getNodeCenter(id) {
                const pos = positions[id];
                if (!pos) return null;
                const el = nodeEls[id];
                const w = el ? el.offsetWidth || NW : NW;
                const h = el ? el.offsetHeight || NH : NH;
                return {
                    x: pos.x + w / 2,
                    y: pos.y + h / 2,
                    top: { x: pos.x + w / 2, y: pos.y },
                    bot: { x: pos.x + w / 2, y: pos.y + h },
                    left: { x: pos.x, y: pos.y + h / 2 },
                    right: { x: pos.x + w, y: pos.y + h / 2 },
                };
            }

            function bestAnchors(a, b) {
                const dx = b.x - a.x,
                    dy = b.y - a.y;
                if (Math.abs(dx) > Math.abs(dy)) {
                    return dx > 0 ? [a.right, b.left] : [a.left, b.right];
                } else {
                    return dy > 0 ? [a.bot, b.top] : [a.top, b.bot];
                }
            }

            function curvePath(p1, p2) {
                const mx = (p1.x + p2.x) / 2;
                const my = (p1.y + p2.y) / 2;
                const dx = p2.x - p1.x,
                    dy = p2.y - p1.y;
                const cx = mx - dy * 0.2,
                    cy = my + dx * 0.2;
                return `M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`;
            }

            function makeEdge(fromId, toId) {
                const key = fromId + "__" + toId;
                if (edgeEls[key]) return;
                const path = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path",
                );
                path.setAttribute("fill", "none");
                path.setAttribute("stroke", "rgba(255,255,255,0.06)");
                path.setAttribute("stroke-width", "1");
                path.setAttribute("marker-end", "url(#arr-dim)");
                path.dataset.from = fromId;
                path.dataset.to = toId;
                svgEl.appendChild(path);
                edgeEls[key] = path;
            }

            GENRES.forEach((g) => {
                g.rel_out.forEach((t) => makeEdge(g.id, t));
            });

            let activeId = null;

            function drawEdges() {
                const rect = document.body.getBoundingClientRect();
                svgEl.setAttribute(
                    "viewBox",
                    `0 0 ${rect.width} ${rect.height}`,
                );

                for (const [key, path] of Object.entries(edgeEls)) {
                    const fromId = path.dataset.from;
                    const toId = path.dataset.to;
                    const a = getNodeCenter(fromId);
                    const b = getNodeCenter(toId);
                    if (!a || !b) {
                        path.setAttribute("d", "");
                        continue;
                    }

                    // world → screen
                    function ws(pt) {
                        return { x: pt.x * scale + tx, y: pt.y * scale + ty };
                    }

                    const [ap, bp] = bestAnchors(a, b);
                    const p1s = ws(ap),
                        p2s = ws(bp);

                    const isActive =
                        activeId && (fromId === activeId || toId === activeId);
                    const isRelated =
                        activeId &&
                        (GENRES.find(
                            (g) => g.id === activeId,
                        )?.rel_out.includes(toId) ||
                            GENRES.find(
                                (g) => g.id === activeId,
                            )?.rel_out.includes(fromId) ||
                            fromId === activeId ||
                            toId === activeId);

                    if (activeId) {
                        if (isActive) {
                            path.setAttribute(
                                "stroke",
                                fromId === activeId
                                    ? "rgba(200,169,110,0.6)"
                                    : "rgba(126,184,200,0.5)",
                            );
                            path.setAttribute("stroke-width", "1.5");
                            path.setAttribute(
                                "marker-end",
                                fromId === activeId
                                    ? "url(#arr-gold)"
                                    : "url(#arr-blue)",
                            );
                        } else {
                            path.setAttribute(
                                "stroke",
                                "rgba(255,255,255,0.03)",
                            );
                            path.setAttribute("stroke-width", "0.5");
                            path.setAttribute("marker-end", "url(#arr-dim)");
                        }
                    } else {
                        path.setAttribute("stroke", "rgba(255,255,255,0.06)");
                        path.setAttribute("stroke-width", "1");
                        path.setAttribute("marker-end", "url(#arr-dim)");
                    }

                    path.setAttribute("d", curvePath(p1s, p2s));
                }
            }

            function activateNode(id) {
                if (activeId === id) {
                    // deactivate
                    activeId = null;
                    Object.values(nodeEls).forEach((el) => {
                        el.classList.remove("active", "dimmed");
                    });
                    drawEdges();
                    return;
                }
                activeId = id;
                const genre = GENRES.find((g) => g.id === id);
                const related = new Set([
                    id,
                    ...(genre?.rel_out || []),
                    ...GENRES.filter((g) => g.rel_out.includes(id)).map(
                        (g) => g.id,
                    ),
                ]);

                Object.entries(nodeEls).forEach(([nid, el]) => {
                    el.classList.remove("active", "dimmed");
                    if (nid === id) el.classList.add("active");
                    else if (!related.has(nid)) el.classList.add("dimmed");
                });
                drawEdges();
            }

            function navigateTo(id) {
                const pos = positions[id];
                if (!pos) return;
                activateNode(id);
                const vw = window.innerWidth,
                    vh = window.innerHeight;
                const el = nodeEls[id];
                const w = el ? el.offsetWidth || NW : NW;
                const h = el ? el.offsetHeight || NH : NH;
                tx = vw / 2 - (pos.x + w / 2) * scale;
                ty = vh / 2 - (pos.y + h / 2) * scale;
                applyTransform(true);
            }

            // ─── pan & zoom ───
            let dragging = false,
                startX = 0,
                startY = 0,
                startTx = 0,
                startTy = 0;

            document.addEventListener("mousedown", (e) => {
                if (
                    e.target.closest(".node") ||
                    e.target.closest("#ui") ||
                    e.target.closest("#zoom-btns") ||
                    e.target.closest("#reset-btn")
                )
                    return;
                dragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startTx = tx;
                startTy = ty;
                document.body.style.cursor = "grabbing";
            });
            document.addEventListener("mousemove", (e) => {
                if (!dragging) return;
                tx = startTx + (e.clientX - startX);
                ty = startTy + (e.clientY - startY);
                applyTransform();
            });
            document.addEventListener("mouseup", () => {
                dragging = false;
                document.body.style.cursor = "default";
            });

            document.addEventListener(
                "wheel",
                (e) => {
                    e.preventDefault();
                    const factor = e.deltaY < 0 ? 1.08 : 0.92;
                    const cx = e.clientX,
                        cy = e.clientY;
                    const newScale = Math.max(
                        0.15,
                        Math.min(2.5, scale * factor),
                    );
                    tx = cx - (cx - tx) * (newScale / scale);
                    ty = cy - (cy - ty) * (newScale / scale);
                    scale = newScale;
                    applyTransform();
                },
                { passive: false },
            );

            document.getElementById("zin").onclick = () => {
                scale = Math.min(2.5, scale * 1.15);
                applyTransform(true);
            };
            document.getElementById("zout").onclick = () => {
                scale = Math.max(0.15, scale / 1.15);
                applyTransform(true);
            };
            document.getElementById("reset-btn").onclick = () => {
                tx = 0;
                ty = 0;
                scale = 0.55;
                activeId = null;
                Object.values(nodeEls).forEach((el) =>
                    el.classList.remove("active", "dimmed"),
                );
                applyTransform(true);
            };

            // ─── search ───
            document.getElementById("search").addEventListener("input", (e) => {
                const q = e.target.value.toLowerCase().trim();
                if (!q) {
                    Object.values(nodeEls).forEach((el) =>
                        el.classList.remove("dimmed"),
                    );
                    document.getElementById("count").textContent = "";
                    activeId = null;
                    drawEdges();
                    return;
                }
                let hits = 0;
                GENRES.forEach((g) => {
                    const match =
                        g.genre.toLowerCase().includes(q) ||
                        g.artist.toLowerCase().includes(q) ||
                        g.title.toLowerCase().includes(q) ||
                        g.region.toLowerCase().includes(q);
                    nodeEls[g.id].classList.toggle("dimmed", !match);
                    if (match) hits++;
                });
                document.getElementById("count").textContent =
                    `${hits} resultado${hits !== 1 ? "s" : ""}`;
                drawEdges();
            });

            // touch support
            let touches = {},
                lastDist = 0;
            document.addEventListener(
                "touchstart",
                (e) => {
                    if (e.touches.length === 1) {
                        dragging = true;
                        startX = e.touches[0].clientX;
                        startY = e.touches[0].clientY;
                        startTx = tx;
                        startTy = ty;
                    } else if (e.touches.length === 2) {
                        lastDist = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY,
                        );
                    }
                },
                { passive: true },
            );
            document.addEventListener(
                "touchmove",
                (e) => {
                    e.preventDefault();
                    if (e.touches.length === 1 && dragging) {
                        tx = startTx + (e.touches[0].clientX - startX);
                        ty = startTy + (e.touches[0].clientY - startY);
                        applyTransform();
                    } else if (e.touches.length === 2) {
                        const dist = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY,
                        );
                        const factor = dist / lastDist;
                        scale = Math.max(0.15, Math.min(2.5, scale * factor));
                        lastDist = dist;
                        applyTransform();
                    }
                },
                { passive: false },
            );
            document.addEventListener("touchend", () => {
                dragging = false;
            });

            // ─── initial render ───
            applyTransform();
            drawEdges();
            window.addEventListener("resize", drawEdges);

            // center on load
            setTimeout(() => {
                const vw = window.innerWidth,
                    vh = window.innerHeight;
                tx = vw * 0.05;
                ty = 60;
                scale = 0.52;
                applyTransform(true);
                drawEdges();
                document.getElementById("count").textContent =
                    `${GENRES.length} géneros`;
            }, 100);
        </script>
    </body>
</html>
